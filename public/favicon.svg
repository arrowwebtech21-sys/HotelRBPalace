<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- High Contrast Dark Background Circle for Browser Tabs -->
  <circle cx="60" cy="60" r="58" fill="#172215" stroke="#C8A97E" stroke-width="4"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="60" cy="60" r="48" stroke="#C8A97E" stroke-width="3.5" fill="none" />

  <!-- Horizontal Accent Bars on Left (Gold) -->
  <line x1="6" y1="46" x2="38" y2="46" stroke="#C8A97E" stroke-width="3.5" stroke-linecap="round" />
  <line x1="12" y1="52" x2="44" y2="52" stroke="#C8A97E" stroke-width="3.5" stroke-linecap="round" />

  <!-- Horizontal Accent Bars on Right (Sage Green) -->
  <line x1="76" y1="68" x2="108" y2="68" stroke="#85AB8B" stroke-width="3.5" stroke-linecap="round" />
  <line x1="82" y1="74" x2="114" y2="74" stroke="#85AB8B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Larger High-Contrast Monogram R (Vibrant Gold) & B (Vibrant Sage Green) -->
  <g transform="translate(29, 22)">
    <text x="0" y="54" fill="#E6C687" font-size="54" font-family="'Plus Jakarta Sans', 'Sora', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-2">R</text>
    <text x="28" y="54" fill="#85AB8B" font-size="54" font-family="'Plus Jakarta Sans', 'Sora', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-2">B</text>
  </g>
</svg>